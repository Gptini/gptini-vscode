services:
  - type: web
    name: gptini-proxy
    env: node
    region: singapore   # 한국과 가장 가까운 무료 리전
    plan: free
    rootDir: proxy-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TARGET_URL
        sync: false       # http://3.37.92.94:8080 (SSL 전) 또는 https://api.gptini.org (SSL 후)
      - key: API_PATH
        value: /api       # 백엔드 @RequestMapping 확인 후 수정
      - key: WS_PATH
        value: /ws        # 백엔드 WebSocketConfig 확인 후 수정
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: NODE_ENV
        value: production
